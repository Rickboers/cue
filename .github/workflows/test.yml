name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Voice follower test
        run: |
          swiftc -O -o "$RUNNER_TEMP/cue-harness" Cue/Engine/TextNormalizer.swift Cue/Engine/ScriptDocument.swift \
            Cue/Engine/SpeechAligner.swift Cue/Engine/VoiceCommands.swift Cue/Engine/PointTracker.swift EngineTests/main.swift
          "$RUNNER_TEMP/cue-harness"
      - name: Build the app (no signing)
        run: |
          xcodebuild -project Cue.xcodeproj -scheme Cue \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
