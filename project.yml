name: Cue
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # your Apple team ID, or pick it in Xcode (see README)
targets:
  Cue:
    type: application
    platform: iOS
    sources:
      - path: Cue
    info:
      path: Cue/Info.plist
      properties:
        CFBundleDisplayName: Cue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Cue listens to your voice so the script follows along as you speak. Audio never leaves your phone.
        NSSpeechRecognitionUsageDescription: Cue turns your speech into text on your iPhone to keep your place in the script.
        NSMotionUsageDescription: Cue uses motion so you can tilt your phone to scroll the script.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cue
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
